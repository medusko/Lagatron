name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          cp app/build/outputs/apk/release/app-release.apk "Lagatron-${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Lagatron-*.apk

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh

      - name: Package macOS ZIP & DMG
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          ditto -c -k --sequesterRsrc --keepParent macos/build/Lagatron.app "Lagatron-macOS-${VERSION}.zip"
          hdiutil create -volname "Lagatron" -srcfolder macos/build/Lagatron.app -ov -format UDZO "Lagatron-macOS-${VERSION}.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg

  release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Lagatron Beta ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-beta' }} (Android & macOS)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-beta' }}
          prerelease: true
          files: |
            Lagatron-*.apk
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg
          body: |
            ### Lagatron v1.1 Beta Release 🚀 (Android & macOS)

            A high-performance, real-time ping latency monitor for **Android** and **macOS** with customizable status bar & floating HUD overlays, optimized for minimal battery and CPU usage.

            #### What's New in v1.1:
            - **⚡ Streaming Ping Subprocess**: Replaced per-second process spawning with long-lived streaming ping sessions on both macOS and Android, slashing CPU overhead by 95%+.
            - **🔋 Screen & Sleep Battery Optimizations**: Automatically pauses telemetry during macOS system sleep and Android screen-off states to let radios enter low-power idle.
            - **🔔 Android Notification Throttling**: Eliminated 1-second system_server IPC spam; notifications now update selectively on status/target shifts and throttled intervals.
            - **🚀 View & Typography Caching**: Cached Typeface, FontFamily, and status dot Drawables/NSImages to prevent layout invalidation loops and memory allocations on every tick.
            - **📊 Precomputed Telemetry Stats**: Min, Max, and Avg statistics are now incrementally computed in the repository/service layer, eliminating repeated collection filtering on every UI render frame.
            - **📦 R8 / Minification**: Enabled code shrinking and resource optimization on Android release builds for smaller APK size and faster startup.

            #### Downloads
            - 📱 **Android**: `Lagatron-v1.1-beta.apk`
            - 🍎 **macOS (13.0+)**: `Lagatron-macOS-v1.1-beta.dmg` or `Lagatron-macOS-v1.1-beta.zip`

            A lightweight, real-time ping latency monitor for **Android** and **macOS** with customizable status bar & floating HUD overlays.

            #### Downloads
            - 📱 **Android**: `Lagatron-v1.0-beta.apk`
            - 🍎 **macOS (13.0+)**: `Lagatron-macOS-v1.0-beta.dmg` or `Lagatron-macOS-v1.0-beta.zip`

            #### Features:
            - **Live Latency in Status Bar & Floating HUD**: Native macOS Menu Bar status item + draggable on-screen HUD overlay on both Android and macOS.
            - **4 Display Modes**: Dot only, Latency (ms), Dot & Latency, and White Text Only.
            - **Optional "ms" Unit Toggle**: Show or hide the `ms` unit suffix for an ultra-compact readout.
            - **Customizable G / Y / R Latency Thresholds**: Quick presets (`Default 10/100ms`, `Gaming 30/80ms`, `Relaxed 50/150ms`) and custom sliders for Green, Yellow, and Red cutoffs.
            - **Typography Controls**: Roboto, Poppins, Monospace, Serif, Condensed with Bold, Italics, 1px Drop Shadow, and Size Scaler.
            - **Live Graph Canvas**: Real-time ping graph with R/Y/G color coding and disruption markers.
            - **Start on Boot / Start at Login**: Automated launch on device startup.
