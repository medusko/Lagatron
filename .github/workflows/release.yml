name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib

          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          ks_path = ws / "release.keystore"
          ks_path.write_bytes(base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())))

          def esc(val: str) -> str:
              return val.replace("\\", "\\\\")

          props = "\n".join([
              f"storeFile={esc(str(ks_path))}",
              f"storePassword={esc(os.environ['KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['KEY_PASSWORD'])}",
              "",
          ])
          (ws / "keystore.properties").write_text(props, encoding="utf-8")
          PY

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Clean Up Release Signing Material
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" "${{ github.workspace }}/keystore.properties"

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          cp app/build/outputs/apk/release/app-release.apk "Lagatron-${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Lagatron-*.apk

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh

      - name: Package macOS ZIP & DMG
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          ditto -c -k --sequesterRsrc --keepParent macos/build/Lagatron.app "Lagatron-macOS-${VERSION}.zip"
          hdiutil create -volname "Lagatron" -srcfolder macos/build/Lagatron.app -ov -format UDZO "Lagatron-macOS-${VERSION}.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg

  release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate Release Notes
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC2' }}"
          if [[ -f "CHANGELOG.md" ]] && grep -q "## \[$TAG\]" CHANGELOG.md; then
            awk "/## \[$TAG\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            cat > release_notes.md << EOF
          ### Lagatron $TAG 🚀
          Real-time ping latency monitor and floating HUD overlay for Android and macOS.
          EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Lagatron ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC2' }} (Android & macOS)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC2' }}
          prerelease: true
          files: |
            Lagatron-*.apk
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg
          body_path: release_notes.md
