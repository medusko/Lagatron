name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          cp app/build/outputs/apk/release/app-release.apk "Lagatron-${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Lagatron-*.apk

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh

      - name: Package macOS ZIP & DMG
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1-beta}"
          ditto -c -k --sequesterRsrc --keepParent macos/build/Lagatron.app "Lagatron-macOS-${VERSION}.zip"
          hdiutil create -volname "Lagatron" -srcfolder macos/build/Lagatron.app -ov -format UDZO "Lagatron-macOS-${VERSION}.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg

  release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Lagatron ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC1' }} (Android & macOS)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC1' }}
          prerelease: true
          files: |
            Lagatron-*.apk
            Lagatron-macOS-*.zip
            Lagatron-macOS-*.dmg
          body: |
            ### Lagatron ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC1' }} Release Candidate 1 🚀 (Android & macOS)

            A high-performance, real-time ping latency monitor for **Android** and **macOS** with customizable status bar & floating HUD overlays, optimized for minimal battery and CPU usage.

            #### Release Candidate 1 Highlights:
            - **✨ Information & Diagnostic Parity with Keyboardy**: Comprehensive About screens with Hero identity cards, live diagnostic quick status bars, telemetry architecture pillars, release notes, and direct GitHub links across both macOS and Android.
            - **⚡ Streaming Ping Subprocess**: Replaced per-second process spawning with long-lived streaming ping sessions on both macOS and Android, slashing CPU overhead by 95%+.
            - **🔋 Screen & Sleep Battery Optimizations**: Automatically pauses telemetry during macOS system sleep and Android screen-off states to let radios enter low-power idle.
            - **🔔 Android Notification Throttling**: Eliminated 1-second system_server IPC spam; notifications now update selectively on status/target shifts and throttled intervals.
            - **🚀 View & Typography Caching**: Cached Typeface, FontFamily, and status dot Drawables/NSImages to prevent layout invalidation loops and memory allocations on every tick.
            - **📊 Precomputed Telemetry Stats**: Min, Max, and Avg statistics are now incrementally computed in the repository/service layer, eliminating repeated collection filtering on every UI render frame.
            - **📦 R8 / Minification**: Enabled code shrinking and resource optimization on Android release builds for smaller APK size (1.4MB) and faster startup.

            #### Downloads
            - 📱 **Android**: `Lagatron-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC1' }}.apk`
            - 🍎 **macOS (13.0+)**: `Lagatron-macOS-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1-RC1' }}.dmg` or `.zip`
